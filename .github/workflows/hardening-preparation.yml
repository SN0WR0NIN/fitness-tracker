name: Hardening source preparation
on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/hardening-preparation.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Archive public tracked source and installed framework guidance
        run: |
          mkdir -p /tmp/hardening-source
          git archive --format=tar.gz --output=/tmp/hardening-source/source.tar.gz HEAD
          tar -czf /tmp/hardening-source/framework-tools.tar.gz node_modules/next/dist/docs node_modules/typescript
          git rev-parse HEAD > /tmp/hardening-source/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hardening-public-source
          path: /tmp/hardening-source/
          retention-days: 1
# Temporary preparation workflow: remove before final review. No production credentials, database operations, or write token.
