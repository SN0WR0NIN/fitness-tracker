name: Stay Active E2E
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: stay-active-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_tracker_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fitness_tracker_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fitness_tracker_e2e?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/fitness_tracker_e2e?schema=public
      NEXTAUTH_SECRET: e2e-nextauth-secret-only-for-ci
      NEXTAUTH_URL: http://127.0.0.1:3000
      E2E_TEST_MODE: "1"
      E2E_PASSWORD: E2E-only-Password-123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Hardening unit and archive checks
        run: npm run test:hardening
      - name: Prepare ephemeral database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate --accept-data-loss
          node scripts/e2e-bootstrap.cjs
          npx prisma db execute --schema prisma/schema.prisma --file prisma/focused-controls.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/achievement-engine.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/multiple-activity-friends.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/achievement-final-state.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/admin-score-overrides.sql
          npx prisma db execute --schema prisma/schema.prisma --file prisma/multiple-proof-photos.sql
      - name: Lint safety app changes
        run: >-
          npx eslint src/lib/system-automation.ts src/lib/duplicate-review.ts src/lib/competition-results.ts src/lib/notifications.ts
          src/lib/operating-mode.ts src/lib/activity-corrections.ts src/lib/achievement-engine.ts src/lib/notification-preferences.ts src/lib/feature-response.ts
          src/lib/proof-reference.ts src/lib/proof-access.ts src/lib/operational-backup.ts src/lib/score-explanation.ts src/lib/activity-duplicates.ts
          src/app/api/proofs/route.ts src/app/admin/operations/page.tsx src/components/ScoreExplanation.tsx src/components/ActivityProof.tsx src/components/ProofGallery.tsx
          src/lib/admin-operations.ts src/components/AdminOperationsAnalytics.tsx src/app/api/admin/proofs/orphans/route.ts
          src/lib/friend-selection.ts src/lib/activity-friends.ts src/components/FriendMultiSelect.tsx
          src/lib/daily-friend-bonus.ts src/lib/scoring-ledger.ts src/lib/activities.ts src/components/useDailyFriendBonus.ts src/app/api/activities/friend-bonus/route.ts
          src/app/api/activities/route.ts src/app/api/activities/[id]/route.ts src/components/MyActivitiesHistory.tsx
          src/components/AdminActivityReview.tsx src/app/api/admin/activities/route.ts src/app/api/admin/activities/[id]/route.ts
          src/components/AdminScoreOverrides.tsx src/app/admin/score-overrides/page.tsx src/components/AdminActionHub.tsx
          src/proxy.ts src/app/api/admin/backups/latest/route.ts src/app/api/admin/duplicates/decision/route.ts src/app/api/admin/awards/generate/route.ts
          src/app/api/admin/export/route.ts src/app/api/notifications/route.ts src/app/api/upload/route.ts
          src/app/api/admin/maintenance/route.ts src/app/api/admin/corrections/route.ts src/app/api/corrections/route.ts
          src/app/admin/page.tsx src/app/admin/duplicates/page.tsx src/app/admin/awards/page.tsx src/app/results/page.tsx src/app/notifications/page.tsx
          src/components/DuplicateReviewCentre.tsx src/components/NotificationBell.tsx src/components/Navbar.tsx src/components/WeeklyAwardsAdminControls.tsx src/components/NotificationPreferencesForm.tsx
      - name: Production build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start application
        run: |
          nohup npm start > /tmp/kg-e2e-app.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/kg-e2e-app.log
          exit 1
      - name: Run member/admin E2E
        run: npx playwright test --config=playwright.config.cjs
      - name: Repeat daily bonus release checks without retries
        run: npx playwright test --config=playwright.config.cjs e2e/daily-friend-bonus.spec.cjs e2e/daily-friend-bonus-release.spec.cjs e2e/daily-friend-bonus-achievements.spec.cjs --repeat-each=3 --retries=0
      - name: Privacy and recovery regression without retries
        run: npx playwright test --config=playwright.config.cjs e2e/privacy-recovery.spec.cjs --retries=0
      - name: Install and verify scheduled backup v7 in disposable database only
        run: |
          npx prisma db execute --schema prisma/schema.prisma --file prisma/points-log-backup-v7.sql
          node scripts/check-v7-snapshot.cjs
      - name: Restore synthetic operational fixture into a new empty isolated database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          DRILL_TARGET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fitness_tracker_restore_drill
        run: |
          docker exec "$PG_CONTAINER" createdb -U postgres fitness_tracker_restore_drill
          docker exec "$PG_CONTAINER" pg_dump -U postgres --schema-only --no-owner --no-privileges -n public -n app_internal fitness_tracker_e2e > /tmp/fixture-schema.sql
          python3 - <<'PYSCHEMA'
          from pathlib import Path
          p = Path('/tmp/fixture-schema.sql')
          text = p.read_text()
          assert text.count('CREATE SCHEMA public;') == 1
          p.write_text(text.replace('CREATE SCHEMA public;', 'CREATE SCHEMA IF NOT EXISTS public;'))
          PYSCHEMA
          docker exec -i "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 fitness_tracker_restore_drill < /tmp/fixture-schema.sql
          node scripts/restore-operational-drill.cjs /tmp/kg-hardening-fixture.json --confirm-disposable
          if node scripts/restore-operational-drill.cjs /tmp/kg-hardening-fixture.json --confirm-disposable; then
            echo "ERROR: populated target was not rejected"; exit 1
          fi
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p test-results
          cp /tmp/kg-e2e-app.log test-results/server.log || true
      - name: Upload synthetic hardening screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-ui-review
          path: test-results/*-mobile.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stay-active-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
