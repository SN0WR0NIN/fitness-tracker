name: Prepare multiple-friends source
on:
  push:
    branches: [feature/multiple-activity-friends]
    paths: [scripts/apply-multiple-friends-once.cjs]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'SN0WR0NIN/fitness-tracker' && github.ref == 'refs/heads/feature/multiple-activity-friends'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply reviewed source edits on feature branch only
        run: |
          node --check scripts/apply-multiple-friends-once.cjs
          node scripts/apply-multiple-friends-once.cjs
          git diff --check
          git add src prisma scripts/validate-operational-backup.cjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Support multiple registered friends across activity workflows'
          git push origin HEAD:feature/multiple-activity-friends
