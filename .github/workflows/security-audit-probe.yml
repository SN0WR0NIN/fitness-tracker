name: Dependency security cleanup

on:
  push:
    branches:
      - chore/dependency-security-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-security-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Remove unused AWS SDK v2 and refresh lockfile
        run: npm uninstall aws-sdk
      - name: Verify audit is clean
        run: npm audit --audit-level=low
      - name: Verify production build
        run: npm run build
      - name: Commit dependency cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Remove unused vulnerable AWS SDK v2 dependency'
          git push origin HEAD:chore/dependency-security-cleanup
