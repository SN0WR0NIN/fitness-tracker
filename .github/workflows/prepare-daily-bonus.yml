name: Prepare daily friend bonus source
on:
  push:
    branches: [fix/friend-bonus-per-sport-per-day]
    paths: [scripts/prepare-daily-bonus.py, .github/workflows/prepare-daily-bonus.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/friend-bonus-per-sport-per-day
      - name: Apply reviewed source transformations on feature branch only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/prepare-daily-bonus.py')
          source=p.read_text().replace(r'  );\n', r'  `);\n')
          exec(compile(source,str(p),'exec'))
          PY
          git restore .github/workflows/e2e.yml
          rm scripts/prepare-daily-bonus.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/recompute-scores.js MULTIPLE_FRIENDS.md scripts/prepare-daily-bonus.py
          git commit -m 'Enforce once-per-sport Singapore daily friend bonus across activity workflows'
          git push origin HEAD:fix/friend-bonus-per-sport-per-day
