name: EDO App Check

on:
  push:
    branches: [edo-tracker]
    paths:
      - 'edo-app/**'
      - '.github/workflows/edo-app-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edo-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Capture lockfile
        uses: actions/upload-artifact@v4
        with:
          name: edo-lockfile
          path: edo-app/package-lock.json
          if-no-files-found: error
